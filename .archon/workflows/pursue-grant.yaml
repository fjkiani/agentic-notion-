name: pursue-grant
description: |
  End-to-end grant pursuit workflow. Given an org and a target grant (or "find the best grant"),
  this workflow: finds the best opportunity, scores eligibility, gets human approval, drafts the
  full 5-section application, saves it, and creates a tracking record in the Applications Tracker.

  Use this when you want to go from "we need funding" to "application ready to submit" in one workflow.

nodes:
  - id: find_opportunity
    loop:
      prompt: |
        Find the best open grant opportunity for the org mentioned in the user message.
        
        Steps:
        1. Use grant_find_opportunities MCP tool with cancerTypes: ["GBM", "brain cancer", "glioblastoma", "brain tumour"]
        2. Use grant_list to see all grants in the database
        3. Score each opportunity: eligibility match (0-10), funding size (0-10), urgency (0-10)
        4. Rank the top 5 opportunities
        5. Save your ranked list to $ARTIFACTS_DIR/opportunities.json in this format:
           { "ranked": [{ "rank": 1, "grantId": "...", "orgId": "...", "title": "...", "funder": "...", "maxAward": 0, "deadline": "...", "scores": { "eligibility": 0, "funding": 0, "urgency": 0, "composite": 0 }, "recommendedAction": "..." }] }
        
        Output DONE when complete.
      until: DONE
      max_iterations: 3

  - id: approve_opportunity
    approval:
      message: |
        ## Grant Opportunity Analysis Complete
        
        I've analysed all open grant opportunities and ranked them by strategic fit. 
        
        **Top recommendation**: See the ranked list above.
        
        **To proceed**: Approve to draft the full application for the #1 ranked opportunity, 
        or type the name/ID of a different grant you'd like to pursue instead.
      capture_response: true
    depends_on: [find_opportunity]

  - id: draft_application
    loop:
      prompt: |
        Draft a complete 5-section grant application for the approved opportunity.
        
        Steps:
        1. Read $ARTIFACTS_DIR/opportunities.json to get the top opportunity details
        2. Get the org details using org_get
        3. Get the grant details using grant_get
        4. Call POST /api/caid/dossier with body: { "orgId": "[orgId]", "type": "APPLICATION", "stream": false, "context": "Full application for [grant title]. [Any user feedback from approval step]" }
        5. Save the returned dossierId to $ARTIFACTS_DIR/application.json
        6. Create a GrantApplication record using application_create MCP tool with:
           - orgId, grantId, dossierId, title: "[Grant Name] Application — [Org Name]"
           - notes: "Draft generated by Archon pursue-grant workflow"
           - nextStep: "Internal review and revision before submission"
           - internalScore: [your confidence 1-10]
           - funderScore: [strategic fit score 1-10]
        7. Save the applicationId to $ARTIFACTS_DIR/application.json
        
        Output DONE when complete.
      until: DONE
      max_iterations: 5
    depends_on: [approve_opportunity]

  - id: approve_application
    approval:
      message: |
        ## Application Draft Complete
        
        The full 5-section grant application has been drafted and saved to the Applications Tracker.
        
        **Sections completed**:
        - ✅ Eligibility & Strategic Fit Analysis
        - ✅ Funder Intelligence Brief  
        - ✅ Specific Aims / Executive Summary
        - ✅ Research Narrative (Background, Innovation, Approach)
        - ✅ Budget Outline & Cover Letter
        
        **View the application**: Go to CAID → Applications to see the full draft.
        
        Approve to mark as INTERNAL_REVIEW, or provide revision feedback.
      capture_response: true
      on_reject:
        prompt: |
          The user has requested revisions. Read their feedback and update the application.
          
          1. Read $ARTIFACTS_DIR/application.json for the applicationId and dossierId
          2. Note the revision feedback: $REJECTION_REASON
          3. Use application_update to add the feedback as notes
          4. Summarise what revisions are needed and confirm they've been noted
          
          Output DONE when complete.
        max_attempts: 3
    depends_on: [draft_application]

  - id: finalize
    loop:
      prompt: |
        Finalise the grant pursuit and generate a next-steps summary.
        
        Steps:
        1. Read $ARTIFACTS_DIR/application.json for the applicationId
        2. Update the application status to INTERNAL_REVIEW using application_update
        3. Generate a next-steps summary and save to $ARTIFACTS_DIR/next_steps.md:
           - Who to contact at the funder (name, email, role)
           - Recommended submission date (2 weeks before deadline)
           - Internal review checklist (scientific review, budget approval, PI sign-off)
           - What supporting documents to prepare (CVs, letters of support, preliminary data)
           - Any LOI deadline if applicable
        
        Output DONE when complete.
      until: DONE
      max_iterations: 2
    depends_on: [approve_application]
