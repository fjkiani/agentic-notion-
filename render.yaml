services:
  # ─── Web App (Next.js 15) ─────────────────────────────────────────────────
  - type: web
    name: agentic-notion-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false && pnpm --filter @zeta/db run build && pnpm --filter @zeta/shared run build && pnpm --filter @zeta/types run build && NODE_ENV=production pnpm --filter @zeta/web run build
    startCommand: cd apps/web && pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://zeta_caid_user:iA9nm6J1kTqriPMnf6FT6Td6FRMXtz3k@dpg-d8ostq67r5hc73cdlfpg-a.oregon-postgres.render.com/zeta_caid_prod
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: NEXT_PUBLIC_MCP_SERVER_URL
        fromService:
          type: web
          name: agentic-notion-mcp
          envVarKey: RENDER_EXTERNAL_URL
      - key: AGENT_API_TOKEN
        sync: false
      - key: NEXT_PUBLIC_AGENT_API_URL
        fromService:
          type: web
          name: agentic-notion-agents
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        sync: false

  # ─── MCP Server ───────────────────────────────────────────────────────────
  - type: web
    name: agentic-notion-mcp
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false && pnpm --filter @zeta/db run build && pnpm --filter @zeta/shared run build && pnpm --filter @zeta/types run build && pnpm --filter @zeta/mcp-server run build
    startCommand: cd apps/mcp-server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        value: postgresql://zeta_caid_user:iA9nm6J1kTqriPMnf6FT6Td6FRMXtz3k@dpg-d8ostq67r5hc73cdlfpg-a.oregon-postgres.render.com/zeta_caid_prod
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: MCP_TRANSPORT
        value: http
      - key: SEED_ON_START
        value: "true"

  # ─── Agent API (LangGraph) ────────────────────────────────────────────────
  - type: web
    name: agentic-notion-agents
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false && pnpm --filter @zeta/db run build && pnpm --filter @zeta/shared run build && pnpm --filter @zeta/types run build && pnpm --filter @zeta/agent-api run build
    startCommand: cd apps/agent-api && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: DATABASE_URL
        value: postgresql://zeta_caid_user:iA9nm6J1kTqriPMnf6FT6Td6FRMXtz3k@dpg-d8ostq67r5hc73cdlfpg-a.oregon-postgres.render.com/zeta_caid_prod
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MCP_SERVER_URL
        fromService:
          type: web
          name: agentic-notion-mcp
          envVarKey: RENDER_EXTERNAL_URL
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: AGENT_API_TOKEN
        sync: false
      - key: APP_URL
        sync: false

  # ─── One-shot DB seed job ─────────────────────────────────────────────────
  # Run once after deploy to seed 88 orgs + 26 grants + 84 contacts
  - type: job
    name: zeta-caid-seed
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --prod=false && pnpm --filter @zeta/db run build
    startCommand: NODE_ENV=production pnpm --filter @zeta/db exec tsx ../../scripts/seed-caid.ts
    envVars:
      - key: DATABASE_URL
        value: postgresql://zeta_caid_user:iA9nm6J1kTqriPMnf6FT6Td6FRMXtz3k@dpg-d8ostq67r5hc73cdlfpg-a.oregon-postgres.render.com/zeta_caid_prod
